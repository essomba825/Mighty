<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0;padding:0;background:#f4f6fa;font-family:Arial,Helvetica,sans-serif;color:#1e2430;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fa;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0"
               style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e3e8f0;">
          <tr>
            <td style="background:#12203a;padding:20px 28px;">
              <a href="{{ site_url }}" style="color:#ffffff;text-decoration:none;font-size:18px;font-weight:bold;">
                Mega Mighty Sixers
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              {% block contenu %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="background:#f4f6fa;padding:16px 28px;font-size:12px;color:#6b7280;">
              <p style="margin:0;">
                Vous recevez cet email car un compte vous est lié sur
                <a href="{{ site_url }}" style="color:#12203a;">Mega Mighty Sixers</a>,
                l'association des anciens élèves.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
